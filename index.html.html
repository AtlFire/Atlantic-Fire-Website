<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlantic Wildfire Mitigation &amp; Co</title>
<meta name="description" content="Atlantic Wildfire Mitigation & Co — back soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50,4 C60,22 82,36 82,62 C82,82 68,96 50,96 C32,96 18,82 18,62 C18,46 28,36 36,28 C38,38 44,40 46,38 C46,26 44,14 50,4 Z' fill='%231F4A3D'/%3E%3Cpath d='M50,58 C57,66 62,73 62,80 C62,88 56,90 50,90 C44,90 38,88 38,80 C38,73 43,66 50,58 Z' fill='%23E8A33D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f1f4f2; --ink:#1c2a25; --muted:#5b6b64; --brand:#1f4a3d; --amber:#e8a33d;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1815; --ink:#e9f0ec; --muted:#9fb1a8; --brand:#9cc5b5; }
}
:root[data-theme="dark"]{ --bg:#0f1815; --ink:#e9f0ec; --muted:#9fb1a8; --brand:#9cc5b5; }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 20px;
  text-align:center;
}
.wrap{max-width:480px}
.flame{width:74px;height:74px;margin:0 auto 28px}
h1{
  font-family:"Bricolage Grotesque",system-ui,sans-serif;
  font-size:clamp(1.6rem,5vw,2.1rem);font-weight:800;letter-spacing:-.01em;
  margin:0 0 14px;line-height:1.2;
}
p{font-size:1.05rem;line-height:1.55;color:var(--muted);margin:0 0 8px}
.contact{margin-top:26px;font-size:.95rem;color:var(--muted)}
.contact a{color:var(--brand);font-weight:600;text-decoration:none}
.contact a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <svg class="flame" viewBox="0 0 100 100" role="img" aria-label="Atlantic Wildfire Mitigation and Co logo">
    <path d="M50,4 C60,22 82,36 82,62 C82,82 68,96 50,96 C32,96 18,82 18,62 C18,46 28,36 36,28 C38,38 44,40 46,38 C46,26 44,14 50,4 Z" style="fill:var(--brand)"/>
    <path d="M50,58 C57,66 62,73 62,80 C62,88 56,90 50,90 C44,90 38,88 38,80 C38,73 43,66 50,58 Z" fill="#E8A33D"/>
  </svg>
  <h1>We'll be back shortly.</h1>
  <p>Atlantic Wildfire Mitigation &amp; Co is offline for a short time while we make some updates.</p>
  <p>Thanks for your patience.</p>
  <div class="contact">
    <a href="mailto:mitigation@atlanticwildfire.com">mitigation@atlanticwildfire.com</a>
  </div>
</div>
</body>
</html>
